name: CI

on:
  push:
    # 对所有分支的 push 都跑 —— 只跑 main 会让任务分支在合并前毫无门禁，
    # 等合进 main 才发现红，分支策略的核心价值就没了。
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 门禁第一行会打印分支名。不传时它显示「分支：未知」—— 按仓库约定，那不叫通过。
      # push 时 ref_name 是分支名；pull_request 时是「<编号>/merge」，同样不是 main。
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # 固定到补丁号，且与 package.json 的 packageManager 同值：lockfile 格式与依赖布局按 pnpm
      # 版本给，浮动到另一个小版本后，「本地装得上、CI 装不上」这类差异就复现不了。
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 直接跑脚本而不是 `pnpm <script>`：本机实测 `pnpm run` 会因 pnpm 自身的
      # 依赖预检查而失败，换成显式命令可以绕开这一类不确定性。
      # dist/ 被 .gitignore 忽略，而测试 import 的是它 —— 不先构建，干净检出上测试必报模块找不到。
      # 与本地门禁**同一条命令**（11 项，项数以 scripts/check-all.mjs 的 STEPS 为准），
      # 包括测试的替身参数 —— 否则两边跑的降级路径不同。
      # 为什么不再逐条重列：2026-10-21 审核发现这里原本只跑了 5 步，阈值登记（thresholds）、
      # 阈值来历评审（thresholds-review）、来历查询（thresholds-query）、文档一致性（docs）、
      # 日志边界（log-boundary）五项从未在 CI 上跑过。逐条复制清单早晚会再漏一项。
      - run: node scripts/check-all.mjs

      # 真实模型验证不进 CI：要下载模型、耗时数十秒，且必须是网络可用时才跑。
      # 它们由维护者在合并前手动执行（详见 docs/DEVELOPMENT.md）。
