allowBuilds:
  esbuild: set this to true or false
  onnxruntime-node: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false

# 依赖链接方式：hoisted（把依赖平铺到顶层）。
# 默认的 isolated 模式依赖符号链接，在无法创建链接的环境（受限容器、部分 Windows 配置）
# 下会装出空目录或缺失包。平铺方式牺牲少量隔离性，换取到处都能装。
nodeLinker: hoisted

# pnpm 默认忽略所有依赖的构建脚本；下面这些必须放行，否则原生二进制不可用。
onlyBuiltDependencies:
  - esbuild
  - onnxruntime-node
  - sharp